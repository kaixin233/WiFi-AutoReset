name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: WiFi 自动重置 v2.8.0（悬浮窗稳定性优化）
          body: |
            ## WiFi 自动重置 v2.8.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App，零依赖纯原生单页实现。

            ### 本次更新（v2.8.0）
            - **悬浮窗状态自愈**：划掉任务卡片后再次进入应用，若服务被系统回收会自动补拉，开关不再“显示已开但没有窗口”。
            - **全透明悬浮窗**：背景完全透明，文字带阴影保证浅色画面可读；可拖动到顶部状态栏区域，位置自动记忆。
            - **尺寸不再闪动**：固定窗口宽度、等宽字体与定长数值，网速变化时窗口不再伸缩。

            ### 当前功能
            - 实时网速（App 可见或悬浮窗开启时采样）
            - 恢复出厂设置（二次确认，真实执行）
            - 打开管理页面：系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 定时自动重置（以重置时间为计时起点）+ 前台保活 + 执行结果通知
            - 日志开关 / 清空 / 折叠展开

            ### ⚠️ 关于保活
            若任务仍被系统清理，请在仪表盘「后台保活」中开启自启动、将省电策略设为「无限制」，或在最近任务界面下拉锁定应用卡片。设置完成后按钮会自动隐藏。

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，可直接覆盖升级到 v2.8.0，设置与日志保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
