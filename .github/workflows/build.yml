name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: WiFi 自动重置 v2.3.0（智能调度版）
          body: |
            ## WiFi 自动重置 v2.3.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v2.3.0）—— 智能调度 + 修复闪退 + 进一步省电
            - **新增智能调度（默认开启）**：到点先测网速，低于 500 KB/s 视为空闲/疑似被云控，立即重置；达到 500 KB/s 视为繁忙，每 5 分钟延缓一次，最多 6 次（30 分钟）后强制执行，避免在忙时打断使用。可在自动化页面关闭。
            - **修复「保存设置」闪退**：Android 12+ 缺少精确闹钟权限（SCHEDULE_EXACT_ALARM）时调用 setExact* 抛 SecurityException；现补齐权限声明，并在未授权时自动降级为普通闹钟，不再闪退。
            - **删除前台应用检测与无障碍服务**：移除系统常驻无障碍服务，权限更敏感、耗电更高，现全部移除，后台开销进一步降低。
            - 后台几乎零开销：网速仅仪表盘可见时采样、设备状态轮询已移除、定时任务由系统 AlarmManager 调度。

            ### 历史回顾
            - v2.2.0：删除设备状态轮询 / 设备信息框，管理页改用系统浏览器
            - v2.1.2：修复恢复出厂不生效（时间戳需拼在 file 值末尾）
            - v2.1.0：零第三方依赖纯原生重写
            - v2.0.1：适配 Android 16 全屏边角

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，v1.0.3 ~ v2.2.0 可直接覆盖到 v2.3.0，设置与日志会保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次（早期 CI 自动生成的密钥证书不同）。

            ### 当前功能
            - 实时网速（仅仪表盘可见时采样，不走网络、后台零开销）
            - 恢复出厂 / 重启设备，均带二次确认
            - 打开管理页面：唤起系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 智能定时自动化（忙时延缓 / 空闲重置）+ 可关闭的本地执行日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
