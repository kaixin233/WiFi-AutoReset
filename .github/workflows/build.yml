name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10.0
          name: WiFi 自动重置 v2.10.0（悬浮窗旋转修复 + 固定周期为主）
          body: |
            ## WiFi 自动重置 v2.10.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App，零依赖纯原生单页实现。

            ### 本次更新（v2.10.0）
            - **横竖屏切换悬浮窗不再消失**：改用 `WindowManager` 实时屏幕尺寸，旋转时移除并重建窗口；运行中每秒自检窗口是否仍附加、坐标是否越界，异常立即自愈。
            - **悬浮窗无法拖出屏幕**：严格钳制在屏幕内，仅允许进入顶部状态栏区域，杜绝因坐标越界导致的“隐身”。
            - **固定周期为主，智能策略降为辅助**：取消二者互斥模式，改为两个独立开关。固定周期照常按点重置；智能辅助作为额外检测，只在两次周期之间确认云控限速且空闲时提前重置，不影响固定周期节奏。智能重置后会同步刷新固定周期基准。

            ### 此前功能
            - **仅 MiFi-281F 生效**：固件指纹 `realm="Highwmg"` 识别目标设备，不需定位权限；其它 WiFi 静默跳过。
            - **防频繁无效重置**：熄屏不作限速判定；重置后 30 分钟保护期；期末核验网速，未恢复则指数退避并通知。
            - **智能判定**：有效窗口 ≥ 10 MB、平均 < 500 KB/s 连续 2 次 + 30 秒复核；每日最多 3 次。
            - **实时网速 + 全透明可拖动悬浮窗**（双击关闭、尺寸固定不闪动）
            - 恢复出厂设置（二次确认）、系统浏览器打开管理页（admin/admin）
            - 前台保活 + 执行结果通知、日志开关 / 清空 / 折叠展开

            ### ⚠️ 关于保活
            若任务仍被系统清理，请在仪表盘「后台保活」中开启自启动、将省电策略设为「无限制」，或在最近任务界面下拉锁定应用卡片。设置完成后按钮会自动隐藏。

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，可直接覆盖升级到 v2.10.0，设置与日志保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
