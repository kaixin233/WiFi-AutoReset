name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: WiFi 自动重置 v2.5.0（计时规则简化版）
          body: |
            ## WiFi 自动重置 v2.5.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App，零依赖纯原生实现。

            ### 本次更新（v2.5.0）—— 更简单的定时规则 + 更易读的日志
            - **移除智能调度**：删除忙闲判断与延缓重试，定时任务到点直接执行，逻辑更简洁、开销更低。
            - **计时基准改为重置时间**：倒计时从「最近一次恢复出厂设置」开始，手动重置后自动重新计时；不再按整点对齐。周期改为 15 分 / 30 分 / 1 小时 / 2 小时 / 自定义，移除了 6 小时、12 小时档位。
            - **日志卡片化**：时间、动作、结果、详情分层展示，结果按成功 / 失败着色，浏览更清晰。
            - 文档与 Release 文案精简。

            ### 当前功能
            - 实时网速（仅仪表盘可见时采样，后台零开销）
            - 恢复出厂 / 重启设备，均带二次确认
            - 打开管理页面：系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 定时自动重置（以重置时间为计时起点）+ 执行结果通知 + 可关闭的本地日志

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，可直接覆盖升级到 v2.5.0，设置与日志保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
