name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.2
          name: WiFi 自动重置 v2.9.2（横屏悬浮窗修复）
          body: |
            ## WiFi 自动重置 v2.9.2

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App，零依赖纯原生单页实现。

            ### 本次更新（v2.9.2）—— 横屏悬浮窗不再消失
            - **旋转不重建**：悬浮窗服务声明 `configChanges`，横竖屏切换不再被系统重建、移除窗口。
            - **位置自动校正**：配置变化时把窗口坐标钳制回当前屏幕可见范围，避免竖屏位置在横屏后落到屏幕外；拖动边界也实时跟随屏幕尺寸。
            - **重建自愈兜底**：个别 ROM 仍强制重建服务时，`onCreate` 会按开关与权限自动恢复窗口。

            ### 上次更新（v2.9.1，未单独发布）—— 限定目标设备 + 防无效重置
            - **仅 MiFi-281F 生效**：通过固件指纹 `realm="Highwmg"` 识别目标设备，不读 SSID、不需定位权限；连其它 WiFi 时静默跳过。
            - **防频繁无效重置**：熄屏时不作限速判定；重置后 30 分钟保护期静默；期末核验网速，未恢复则退避并通知，避免“无效重置天天循环”。

            ### 更早（v2.9.0）—— 智能策略
            - **双模式**：仪表盘可切换「固定周期」与「智能策略」。
            - **判定**：每 2 分钟采样；有效窗口 ≥ 10 MB、平均 < 500 KB/s，连续 2 次 + 30 秒复核确认云控。
            - **体验保护**：仅空闲时重置，10 秒可撤销通知，最长等待 15 分钟，每日最多 3 次。

            ### 当前功能
            - 实时网速 + 全透明可拖动悬浮窗（双击关闭，横竖屏不消失）
            - 恢复出厂设置（二次确认，真实执行）
            - 打开管理页面：系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 固定周期 / 智能策略两种自动重置 + 前台保活 + 执行结果通知
            - 日志开关 / 清空 / 折叠展开

            ### ⚠️ 关于保活
            若任务仍被系统清理，请在仪表盘「后台保活」中开启自启动、将省电策略设为「无限制」，或在最近任务界面下拉锁定应用卡片。设置完成后按钮会自动隐藏。

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，可直接覆盖升级到 v2.9.2，设置与日志保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
