name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.0
          name: WiFi 自动重置 v2.9.0（智能限速调控）
          body: |
            ## WiFi 自动重置 v2.9.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App，零依赖纯原生单页实现。

            ### 本次更新（v2.9.0）—— 智能限速调控
            - **双模式**：仪表盘可选择「固定周期」或「智能限速」，两者互斥；智能模式只在确认云控限速且你空闲时才重置。
            - **判定规则**：每 2 分钟采样上下行之和；有效窗口 ≥ 10 MB、平均速率 < 500 KB/s，连续 2 次后再做 30 秒短窗复核。
            - **体验保护**：仅在熄屏或连续 15 秒低于 30 KB/s 时执行；最多等待 15 分钟，屏幕亮着执行前给 10 秒可撤销通知。
            - **安全边界**：仅在 WiFi 下检测；重置后冷却 10 分钟，每日最多 3 次；网速恢复到 1.5 MB/s 时自动取消本轮。
            - **状态可视**：仪表盘显示「正常 / 疑似限速 · 等待空闲 / 冷却中」，日志只记成功与失败。

            ### 当前功能
            - 实时网速（App 可见或悬浮窗开启时采样）
            - 恢复出厂设置（二次确认，真实执行）
            - 打开管理页面：系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 固定周期 / 智能限速两种自动重置 + 前台保活 + 执行结果通知
            - 日志开关 / 清空 / 折叠展开

            ### ⚠️ 关于保活
            若任务仍被系统清理，请在仪表盘「后台保活」中开启自启动、将省电策略设为「无限制」，或在最近任务界面下拉锁定应用卡片。设置完成后按钮会自动隐藏。

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，可直接覆盖升级到 v2.9.0，设置与日志保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
