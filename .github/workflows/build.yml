name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure Android platform files
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK (arm64 only)
        # 客户设备为小米 Android 16 64 位，只需 arm64-v8a。
        # 只打单一 ABI 可把 APK 从 ~48MB 降到 ~18MB。
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== AAPT BADGING ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | head -20 || \
            find "$ANDROID_HOME/build-tools" -name aapt -type f | head -1 | xargs -I{} {} dump badging "$APK" 2>/dev/null | head -20
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30
          echo "===== ZIP CONTENT (top) ====="
          unzip -l "$APK" 2>/dev/null | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: WiFi 自动重置 v1.0.1（液体玻璃版）
          body: |
            ## WiFi 自动重置 v1.0.1

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v1.0.1）
            - **移除演练模式**：所有操作点击并二次确认后真实执行（实机已验证恢复出厂可用）
            - **液体玻璃 UI**：毛玻璃卡片、折射高光描边、流动光晕背景、冷色渐变数值
            - **新增下次执行倒计时**：自动化页实时显示距下一个整点的剩余时间

            ### 功能
            - 实时网速（每秒采样收发字节差）
            - 前台应用包名检测（需授权「使用情况访问」）
            - WebView 管理页自动登录 admin/admin
            - 恢复出厂 / 重启 / 清流量三种操作，均带二次确认
            - 整点定时自动化 + 本地执行日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### 适配架构
            仅含 arm64-v8a（针对小米 Android 16 64 位设备），APK 约 18MB。安装包已正确签名，可正常解析安装。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网。演练模式已移除，请谨慎操作。

            完整说明见仓库 README。
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
