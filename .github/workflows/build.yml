name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: WiFi 自动重置 v2.4.0（省电与体验优化版）
          body: |
            ## WiFi 自动重置 v2.4.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v2.4.0）—— 更省电、更稳定、体验更完整
            - **智能调度零开销重构**：不再 sleep 采样 2 秒，改为读取系统累计流量计数器，计算「上次重置至今的周期平均网速」判断忙闲；基于实测「约 90 分钟后再次被云控」，用周期均值已足够，无需精确到秒。
            - **修复 goAsync 超时隐患**：后台广播改用 WakeLock（带超时自动释放）保底执行，避免网络重试超时导致任务被系统判定结束、日志丢失。
            - **深色模式实时跟随系统**：移除 uiMode 的 configChanges，切换外观时重建 Activity 重新加载配色。
            - **执行结果通知**：定时成功 / 失败 / 强制执行时发系统通知（Android 13+ 需授权）；延缓仅记日志不打扰。
            - **下次执行绝对时间**：自动化页在倒计时外新增「下次执行：MM-dd HH:mm」。
            - **P3 代码质量**：删除冗余方法、合并异步执行样板、去掉重复 import。

            ### 历史回顾
            - v2.3.0：删除前台应用/无障碍、修复保存设置闪退、新增智能调度
            - v2.2.0：删除设备状态轮询，管理页改用系统浏览器
            - v2.1.2：修复恢复出厂不生效（时间戳需拼在 file 值末尾）
            - v2.1.0：零第三方依赖纯原生重写

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，v1.0.3 ~ v2.3.0 可直接覆盖到 v2.4.0，设置与日志会保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次（早期 CI 自动生成的密钥证书不同）。

            ### 当前功能
            - 实时网速（仅仪表盘可见时采样，后台零开销）
            - 恢复出厂 / 重启设备，均带二次确认
            - 打开管理页面：唤起系统浏览器访问随身 WiFi 管理页（需输入 admin/admin）
            - 智能定时自动化（周期均值判断忙闲 + 延缓重试）+ 执行结果通知 + 可关闭的本地日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
