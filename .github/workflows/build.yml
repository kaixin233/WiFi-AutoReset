name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: WiFi 自动重置 v2.0.0（纯原生版）
          body: |
            ## WiFi 自动重置 v2.0.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v2.0.0）
            - **纯原生 Kotlin 重写**：彻底移除 Flutter 引擎与 Dart 代码，APK 体积大幅下降
            - **标准底栏**：改用 Material BottomNavigationView 普通样式，修复此前液态玻璃底栏显示异常
            - **保留全部功能**：实时网速、设备状态卡、运营商中文、前台应用无障碍检测、自定义周期、可关闭日志、WebView 自动登录
            - **明暗主题**：跟随系统外观自动切换

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，v1.0.3 ~ v1.0.4 可直接覆盖到 v2.0.0，设置与日志会保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次（早期 CI 自动生成的密钥证书不同）。

            ### 功能
            - 实时网速与设备状态（电量 / 信号 / 运营商 / 在线设备 / 运行时长）
            - 前台应用包名检测（需在系统设置中开启「无障碍服务」）
            - WebView 管理页自动登录 admin/admin
            - 恢复出厂 / 重启 / 清流量三种操作，均带二次确认
            - 自定义周期定时自动化 + 可关闭的本地执行日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
