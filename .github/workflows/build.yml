name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: WiFi 自动重置 v2.0.2（纯原生版）
          body: |
            ## WiFi 自动重置 v2.0.2

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v2.0.2）
            - **包体瘦身**：开启 R8 代码压缩与资源压缩，并限制只保留中文资源，APK 体积进一步下降
            - 功能与 v2.0.1 完全一致，无需重新授权无障碍服务

            ### v2.0.1 修复回顾
            - **修复边角显示**：适配 Android 16 强制全屏（edge-to-edge），顶栏避开状态栏、底栏避开手势条与屏幕圆角，不再被遮挡或重叠
            - **统一圆角**：卡片、按钮、周期标签使用一致的 16dp / 12dp / 10dp 圆角，消除边角发白和锯齿
            - **修复控制请求**：Digest 请求的时间戳改为独立参数，不再污染 action 名；请求串行化，避免并发时 nonce 互相覆盖
            - **修复状态误报**：网关检测失败不再继续显示“在线”；退到后台停止轮询，降低耗电
            - **修复细节缺陷**：自定义周期切回预设后标签残留、日志并发写入风险、无障碍服务误判前台应用、WebView 销毁方式

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，v1.0.3 ~ v2.0.1 可直接覆盖到 v2.0.2，设置与日志会保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次（早期 CI 自动生成的密钥证书不同）。

            ### 功能
            - 实时网速与设备状态（电量 / 信号 / 运营商 / 在线设备 / 运行时长）
            - 前台应用包名检测（需在系统设置中开启「无障碍服务」）
            - WebView 管理页自动登录 admin/admin
            - 恢复出厂 / 重启 / 清流量三种操作，均带二次确认
            - 自定义周期定时自动化 + 可关闭的本地执行日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
