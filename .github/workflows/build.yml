name: build apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-auto-reset-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Diagnose APK (signing & manifest)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "===== FILE ====="
          ls -lh "$APK"
          echo "===== VERSION ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" 2>/dev/null | grep -E '^(package|sdkVersion|targetSdkVersion):' || true
          echo "===== APKSIGNER VERIFY ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1 | head -30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: WiFi 自动重置 v2.2.0（零依赖纯原生版）
          body: |
            ## WiFi 自动重置 v2.2.0

            面向小米手机（Android 16、64 位）的随身 WiFi 自动化控制 App。

            ### 本次更新（v2.2.0）—— 精简界面、降低耗电
            - **删除设备状态轮询**：不再每 10 秒请求状态/信息/网关接口，去掉整个网络轮询，后台更省电、几乎无流量
            - **精简仪表盘**：移除「设备状态」「设备信息」信息框及「重置流量统计」按钮，界面更专注
            - **管理页改用系统浏览器**：删除底栏「管理页」标签与内置 WebView，改为仪表盘「打开管理页面」按钮直接唤起浏览器访问 192.168.1.1
            - 保留实时网速、前台应用检测、恢复出厂 / 重启、自定义周期定时任务与本地日志

            ### 历史回顾
            - v2.1.2：修复恢复出厂不生效（时间戳需拼在 file 值末尾，独立的 `&_t=` 会被固件判为未知 action）
            - v2.1.1：更正请求路径为 `/xml_action.cgi`，修复顶部文字遮挡
            - v2.1.0：零第三方依赖纯原生重写，APK 约 70 KB
            - v2.0.1：适配 Android 16 全屏边角，统一圆角

            ### ⚠️ 关于覆盖安装
            v1.0.3 起使用固定签名密钥，v1.0.3 ~ v2.1.2 可直接覆盖到 v2.2.0，设置与日志会保留。
            若仍在使用 v1.0.1 / v1.0.2，需先卸载一次（早期 CI 自动生成的密钥证书不同）。

            ### 当前功能
            - 实时网速（仅读取系统流量计数器，不走网络、几乎不耗电）
            - 前台应用包名检测（需在系统设置中开启「无障碍服务」）
            - 恢复出厂 / 重启设备，均带二次确认
            - 打开管理页面：唤起系统浏览器访问随身 WiFi 管理页（需在浏览器中输入 admin/admin）
            - 自定义周期定时自动化 + 可关闭的本地执行日志

            ### 实测设备
            Marvell/mifi 固件（LBF1A），HTTP Digest 认证，恢复出厂对应 `json_device_restore_factory`。

            ### ⚠️ 风险提示
            恢复出厂会清空 SSID、WiFi 密码和管理账号并重启，手机会立刻断网，请谨慎操作。

            完整说明见仓库 README。
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
